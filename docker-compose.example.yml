services:
  plex2jellyfin:
    image: ghcr.io/nomadcxx/plex2jellyfin:latest
    container_name: plex2jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - P2J_WEB_HOST=0.0.0.0
      - P2J_WEB_ALLOW_UNAUTHENTICATED_REMOTE=true
    volumes:
      - ./config:/config
      - /path/to/downloads:/watch
      # Completed torrents you keep seeding. Mount them on the same host
      # filesystem as /library so imports hardlink instead of copying.
      - /path/to/torrents:/seeding
      - /path/to/media:/library
    ports:
      # Keep first-run setup on the Docker host; the container network stays reachable to its peers.
      - "127.0.0.1:5522:5522"
    restart: unless-stopped
